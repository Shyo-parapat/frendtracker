<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrendTracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwgVECvjAsQqFlqXL7sbIx2Aviw2F1ZRTU15A5HMp1GMA-vaPOePvlWFV663zRw0dleHw/exec';
        const CATEGORIES = ['Makanan', 'Jajan', 'Investasi', 'Keperluan Mandi', 'Lainnya'];

        function App() {
            const [balance, setBalance] = useState(115000); 
            const [form, setForm] = useState({ type: 'Pengeluaran', amount: '', category: 'Makanan', note: '' });
            const [loading, setLoading] = useState(false);
            const [msg, setMsg] = useState('');

            const formatRupiah = (value) => {
                if (!value) return '';
                const numberString = value.replace(/[^,\d]/g, '').toString();
                const split = numberString.split(',');
                const sisa = split[0].length % 3;
                let rupiah = split[0].substr(0, sisa);
                const ribuan = split[0].substr(sisa).match(/\d{3}/gi);

                if (ribuan) {
                    const separator = sisa ? '.' : '';
                    rupiah += separator + ribuan.join('.');
                }

                return split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
            };

            const handleAmountChange = (e) => {
                const rawValue = e.target.value;
                const numericValue = rawValue.replace(/\./g, '');
                setForm({ ...form, amount: numericValue });
            };

           const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.amount || form.amount <= 0) {
        setMsg('Masukkan nominal dengan benar!');
        return;
    }

    // 1. Instan: Langsung update UI tanpa menunggu fetch
    if (form.type === 'Pemasukan') {
        setBalance(prev => prev + parseInt(form.amount));
    } else {
        setBalance(prev => prev - parseInt(form.amount));
    }
    
    setMsg('Transaksi Tersimpan!');
    const currentForm = { ...form };
    setForm({ type: 'Pengeluaran', amount: '', category: 'Makanan', note: '' });

    // 2. Kirim ke Google Sheets di latar belakang secara senyap
    fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...currentForm, date: new Date().toLocaleDateString() })
    }).catch(err => {
        console.log('Sinkronisasi latar belakang gagal:', err);
    });
};            
return (
                <div className="max-w-md mx-auto p-4 text-white min-h-screen">
                    <header className="mb-6 text-center pt-6">
                        <h1 className="text-3xl font-light">Frend<span className="font-bold text-emerald-400">Tracker</span></h1>
                    </header>

                    <div className="bg-slate-900 rounded-3xl p-8 mb-6 text-center shadow-lg border border-emerald-900/50">
                        <p className="text-slate-400 text-sm mb-2">Total Saldo Anda</p>
                        <h2 className="text-4xl font-bold text-emerald-400">Rp {balance.toLocaleString('id-ID')}</h2>
                    </div>

                    <div className="bg-slate-900/50 backdrop-blur rounded-3xl p-6 border border-slate-800">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-2 gap-2">
                                <button type="button" onClick={() => setForm({...form, type: 'Pemasukan'})} className={`p-3 rounded-xl border ${form.type === 'Pemasukan' ? 'bg-emerald-600 border-emerald-500' : 'bg-slate-800 border-slate-700'}`}>Pemasukan</button>
                                <button type="button" onClick={() => setForm({...form, type: 'Pengeluaran'})} className={`p-3 rounded-xl border ${form.type === 'Pengeluaran' ? 'bg-red-600 border-red-500' : 'bg-slate-800 border-slate-700'}`}>Pengeluaran</button>
                            </div>
                            <div>
                                <input 
                                    type="text" 
                                    placeholder="Nominal (Rp)" 
                                    className="w-full bg-slate-800 p-4 rounded-2xl outline-none border border-slate-700 focus:border-emerald-500" 
                                    value={formatRupiah(form.amount)} 
                                    onChange={handleAmountChange} 
                                    required 
                                />
                            </div>
                            <div>
                                <select className="w-full bg-slate-800 p-4 rounded-2xl outline-none border border-slate-700" value={form.category} onChange={e => setForm({...form, category: e.target.value})}>
                                    {CATEGORIES.map(cat => <option key={cat} value={cat} className="bg-slate-900">{cat}</option>)}
                                </select>
                            </div>
                            <div>
                                <input 
                                    type="text" 
                                    placeholder="Catatan (Opsional)" 
                                    className="w-full bg-slate-800 p-4 rounded-2xl outline-none border border-slate-700 focus:border-emerald-500 text-white" 
                                    value={form.note} 
                                    onChange={e => setForm({ ...form, note: e.target.value })} 
                                />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-emerald-500 hover:bg-emerald-600 py-4 rounded-2xl font-bold text-slate-950 transition">{loading ? 'Memproses...' : 'Simpan Transaksi'}</button>
                        </form>
                    </div>
                    {msg && <p className="text-center mt-4 text-emerald-400 font-medium">{msg}</p>}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
